<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="./fontawesome-free-6.7.2-web/css/all.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <title>Rock, Paper ,Scissors</title>
</head>
<body class="bg-black">
    <div class="container">
        <h1 class="h-rock text-white text-center pt-4 pb-4">Rock Paper Scissors</h1>

        <div >


            <div class="test-pics row d-inline-flex justify-content-around">
               <div class="rock rps border border-5 border-white rounded-circle col-md-3"><img src="./img/270a_color.png" alt="" class="rockpic w-50"> </div> 
               <div class="pap rps border border-5 border-white rounded-circle col-md-3"><img src="./img/c0bfc28ef2db2eebf66879a2dc37ea.webp" class="paperpic w-50 bg-black"></div> 
               <div class="sis rps  border border-5 border-white rounded-circle col-md-3"><img src="./img/89ef5cd84c8a8882dfbafab475e40aac.png" alt="" class="Scissorspic w-40 pic-3 "></div> 

                <div class="bottons d-inline-flex justify-content-around">
                    <button class=" rock btn py-2 px-4 text-bg-secondary border border-secondary rounded-pill" onclick="pcMove(),button1(),score() ">Rock</button>
                    <button class="rock btn py-2 px-4 text-bg-secondary border border-secondary rounded-pill" onclick="pcMove(),button2(),score()">Paper</button>
                    <button class="rock btn py-2 px-4 text-bg-secondary border border-secondary rounded-pill" onclick="pcMove(),button3(),score()">Scissors </button>

                </div>
            </div>

        </div>

        
        <div class="s-reset ">
            <button class=" reset btn py-2 px-4 text-bg-secondary border border-secondary rounded-pill" onclick="reset()"> Reset score</button>
        </div>

        <div class="score mt-5">

            <p class="js-note"></p>
            <p class="js-result"></p>
            <p class="js-score"></p>



        </div>
        
    </div>

    
    <script src="./index.js"></script>
</body>
</html>
